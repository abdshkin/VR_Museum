<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0f0d0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Виртуалды мұражай — Virtual Museum of Kazakh Artists" />
  <title>Қазақ Суретшілері | Виртуалды Мұражай</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet"
  />

  <!-- Styles -->
  <link rel="stylesheet" href="css/main.css" />

  <!-- Three.js r128 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- ==================== LOADER ==================== -->
  <div id="loader" role="status" aria-label="Загрузка">
    <div class="loader-ring" aria-hidden="true"></div>
    <div class="loader-txt" id="loader-txt">Жүктелуде…</div>
  </div>

  <!-- ==================== HEADER ==================== -->
  <header id="hdr">
    <div class="logo" aria-label="Виртуалды мұражай — Kazakh Artists">
      Виртуалды Мұражай
      <small>Kazakh Artists</small>
    </div>

    <!--
      CUSTOMIZE: Add a new language button here + add its strings in js/app.js → LANG object
      e.g. <button class="lang-btn" data-lang="de">DE</button>
    -->
    <nav id="lang-switcher" aria-label="Язык / Тіл / Language">
      <button class="lang-btn" data-lang="kz">ҚЗ</button>
      <button class="lang-btn active" data-lang="ru">РУ</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </nav>
  </header>

  <!-- ==================== APP ==================== -->
  <main id="app">

    <!-- ======= VIEW 1: SLIDER ======= -->
    <section id="slider-view" class="view" aria-label="Галерея художников">

      <div class="header-rule" aria-hidden="true"></div>

      <!-- Подсказка об ориентации телефона -->
      <div id="phone-orientation-hint" class="phone-orientation-hint">
        <div class="phone-orientation-content">
          <div class="phone-orientation-icon">📱</div>
          <div class="phone-orientation-text" id="phone-orientation-text">
            Держите телефон прямо
          </div>
          <div class="phone-orientation-subtext" id="phone-orientation-subtext">
            Для лучшего взаимодействия с 3D
          </div>
        </div>
      </div>

      <div style="text-align:center; margin-bottom: 4px; padding-top: 8px;">
        <div class="section-eyebrow">Казахстан · Искусство · Art</div>
        <h1 class="section-title">Великие художники</h1>
      </div>

      <!--
        SLIDER: Cards generated by js/app.js from data/artists.json
        CUSTOMIZE: Edit artists.json to add/remove/reorder artists
      -->
      <div id="slider-container">
        <div id="slider-track-wrapper">
          <div id="slider-track" role="list" aria-label="Список художников"></div>
        </div>

        <!-- Arrow navigation -->
        <button class="slider-arrow" id="prev-arrow" aria-label="Предыдущий">&#8249;</button>
        <button class="slider-arrow" id="next-arrow" aria-label="Следующий">&#8250;</button>
      </div>

      <!-- Dot indicators -->
      <div id="slider-dots" role="tablist" aria-label="Навигация по художникам"></div>

      <!-- Bio panel — slides up when artist selected -->
      <div id="bio-panel" aria-live="polite">
        <div id="bio-label" class="bio-label">О художнике</div>
        <div id="bio-name">—</div>
        <div id="bio-years"></div>
        <p id="bio-text"></p>
        <button id="bio-enter-btn" aria-label="Войти в зал художника">
          Войти в зал ›
        </button>
      </div>

    </section>

    <!-- ======= VIEW 2: 3D ROOM ======= -->
    <section id="room-view" class="view hidden" aria-label="3D зал художника">

      <!-- Three.js canvas injected here -->
      <div id="aframe-container"></div>

      <!-- UI overlay -->
      <div id="room-ui">

        <button id="room-back-btn" aria-label="Вернуться в галерею">
          ← Назад
        </button>

        <div id="gyro-hint" role="tooltip">
          📱 Перетяни для осмотра
        </div>

        <div id="room-label" aria-live="polite">
          <div id="room-label-name">—</div>
          <div id="room-label-years"></div>
        </div>

      </div>
    </section>

  </main>

  <!-- ==================== FOOTER ==================== -->
  <footer id="app-footer">
    <div class="footer-content">
      <div class="footer-credits">
        <span>Инфографика: <strong>Юлия Лукашова</strong></span>
        <span class="separator">·</span>
        <span>Разработка: <strong>Зияда Абдрахман</strong></span>
      </div>
      <div class="footer-meta">
        <span>КАЗУТБ 2026</span>
      </div>
    </div>
  </footer>

  <!-- ==================== SCRIPTS ==================== -->
  <!--
    Load order is important:
    Three.js (CDN) → app.js (everything else)
    app.js reads data/artists.json via fetch()
  -->
  <script src="js/app.js"></script>

</body>
</html>
